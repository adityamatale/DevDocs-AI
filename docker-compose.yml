services:
  
  # main service
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile

    gpus: all

    ports:
      - "8000:8000"
    
    env_file:
      - .env

    volumes:
      - ${HF_CACHE_PATH:-~/.cache/huggingface}:/root/.cache/huggingface

    # host is local machine - used to connect to ollama on local machine
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - qdrant
      - jaeger

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # vector db service
  qdrant:
    image: qdrant/qdrant:latest

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

  
  # telemetry service
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0

    ports:
      - "16686:16686"
      - "4318:4318"

  # streamlit front end
  frontend:
    build:
      context: ./streamlit_client
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - rag-api
    volumes:
      - ./streamlit_client/.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro


# volumes ..?
volumes:
  qdrant_data:
    external: true