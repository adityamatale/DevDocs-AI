<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevDocs AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>

            <div class="logo">
                <div class="logo-icon">&gt;_</div>
                <h1>DevDocs AI</h1>
            </div>
        
            <p>
                Ask questions about FastAPI, Python, LlamaIndex...
            </p>
        
        </header>

        <section id="answer">
            <p class="placeholder">
                Ask something to get started...
            </p>
        </section>

        <form id="query-form">

            <textarea
                id="query-input"
                placeholder="Ask a question..."
                rows="3"
                required
            ></textarea>

            <button type="submit">
                Ask
            </button>

        </form>

    </main>

    <script src="app.js"></script>

</body>
</html>
