name: Docker Integration Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build

      - name: Show service status
        run: docker compose ps

      - name: Wait for RAG API
        run: |
          echo "Waiting for RAG API..."
          for i in {1..60}; do
            if curl -fs http://localhost:8000/health; then
              echo "RAG API is healthy!"
              exit 0
            fi
            sleep 5
          done

          echo "RAG API failed to become healthy"
          docker compose logs rag-api
          exit 1

      - name: Test Qdrant
        run: curl -fs http://localhost:6333/healthz

      - name: Test RAG API
        run: |
          curl -fs http://localhost:8000/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown
        if: always()
        run: docker compose down -v